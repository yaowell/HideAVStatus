name: Build Rootless & Roothide Tweaks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: internalizing/setup-theos-action@v1
        with:
          theos-sdks: 'iOS'

      # 1. 编译无根 (Rootless) 版本
      - name: Build Rootless Package
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p output/rootless
          mv packages/*.deb output/rootless/

      # 2. 编译隐根 (Roothide) 版本
      - name: Build Roothide Package
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          mkdir -p output/roothide
          mv packages/*.deb output/roothide/

      # 3. 上传无根包产物
      - name: Upload Rootless Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoAVStatus-Rootless-deb
          path: output/rootless/*.deb
          if-no-files-found: error

      # 4. 上传隐根包产物
      - name: Upload Roothide Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoAVStatus-Roothide-deb
          path: output/roothide/*.deb
          if-no-files-found: error
